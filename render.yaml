# 24/7 camera recorder → Supabase (Render Web Service).
# Deploy: New → Web Service → Docker, OR Blueprint from this file.
#
# Required env vars in the dashboard:
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, API_KEY
# Optional: IMAGE_ID, CAMERA_ID, RECORD_SEGMENT_SECS, RECORD_RETENTION_HOURS
# Quiet hours (America/New_York): pause 8 PM–6 AM, resume 6:01 AM
#
# Use Starter+ so the instance does not sleep (Free sleeps after idle).

services:
  - type: web
    name: stocker-recorder
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerCommand: npm run record:24x7
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: IMAGE_ID
        value: "19494"
      - key: CAMERA_ID
        value: "12084"
      - key: RECORD_SEGMENT_SECS
        value: "60"
      - key: RECORD_RETENTION_HOURS
        value: "24"
      - key: RECORD_TZ
        value: America/New_York
      - key: RECORD_QUIET_START
        value: "20:00"
      - key: RECORD_QUIET_END
        value: "06:01"
