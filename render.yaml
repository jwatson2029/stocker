# 24/7 camera recorder → Supabase (Render Web Service).
# Deploy: New → Web Service → Docker, OR Blueprint from this file.
#
# Required env vars in the dashboard:
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, API_KEY
# Optional: IMAGE_ID, CAMERA_ID, RECORD_SEGMENT_SECS, RECORD_IDLE_SECS,
#           RECORD_ENCODE, RECORD_VIDEO_BITRATE, RECORD_MAX_WIDTH,
#           RECORD_RETENTION_HOURS
#
# Defaults: continuous 30s, source quality, no quiet hours.
# On Render Hobby (5 GB egress) set RECORD_ENCODE=1 and RECORD_IDLE_SECS=600.

services:
  - type: web
    name: stocker-recorder
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerCommand: npm run record:24x7
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: IMAGE_ID
        value: "19494"
      - key: CAMERA_ID
        value: "12084"
      - key: RECORD_SEGMENT_SECS
        value: "30"
      - key: RECORD_IDLE_SECS
        value: "0"
      - key: RECORD_ENCODE
        value: "0"
      - key: RECORD_RETENTION_HOURS
        value: "24"
      - key: RECORD_TZ
        value: America/New_York
      - key: RECORD_QUIET_START
        value: "00:00"
      - key: RECORD_QUIET_END
        value: "00:00"
